name: "build-windows"

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build tauri app
        shell: bash
        run: |
          set +e
          pnpm tauri build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -nE -A6 "^error|error TS|error\[|ERROR" build.log | head -c 3000 | tr '\n' '|' | sed 's/%/%25/g')
            echo "::error::$msg"
          fi
          exit $code

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/nsis/*-setup.exe artifacts/
          cp src-tauri/target/release/jmcomic-downloader.exe artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: artifacts/*
